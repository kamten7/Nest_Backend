# ============================================================================
# 演示环境配置（profile=demo）
# ----------------------------------------------------------------------------
# 用途：docker compose --profile full up 时开箱即用。
# 与 prod 的差异仅在于允许本地登录 / 模拟充值；切勿用于公网。
# ============================================================================

server:
  port: ${NEST_HTTP_PORT:8080}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: ${NEST_REDIS_HOST:redis}
      port: ${NEST_REDIS_PORT:6379}
      password: ${NEST_REDIS_PASSWORD:}
      database: ${NEST_REDIS_DATABASE:0}
      timeout: ${NEST_REDIS_TIMEOUT:3000}
      lettuce:
        pool:
          min-idle: ${NEST_REDIS_POOL_MIN_IDLE:1}
          max-idle: 8
          max-active: ${NEST_REDIS_POOL_MAX_ACTIVE:8}
          max-wait: ${NEST_REDIS_POOL_MAX_WAIT:3000}

nest:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: ${NEST_DB_HOST:mysql}
    port: ${NEST_DB_PORT:3306}
    database: ${NEST_DB_NAME:nest_rent}
    username: ${NEST_DB_USER:root}
    password: ${NEST_DB_PASSWORD:}

  jwt:
    admin-secret-key: ${NEST_JWT_ADMIN_SECRET:}
    user-secret-key: ${NEST_JWT_USER_SECRET:}

  cors:
    allowed-origins: ${NEST_CORS_ALLOWED_ORIGINS:http://localhost:5173}

  auth:
    phone-login-enabled: true
  wallet:
    simulate-recharge-enabled: true
  wechat:
    mock-enabled: ${NEST_WECHAT_MOCK:true}
    mock-openid: ${NEST_WECHAT_MOCK_OPENID:nest_demo_tenant}

  minio:
    endpoint: ${NEST_MINIO_ENDPOINT:}
    public-endpoint: ${NEST_MINIO_PUBLIC_ENDPOINT:}
    access-key: ${NEST_MINIO_ACCESS_KEY:}
    secret-key: ${NEST_MINIO_SECRET_KEY:}
    bucket: ${NEST_MINIO_BUCKET:nest-rent}
    avatar-bucket: ${NEST_MINIO_AVATAR_BUCKET:nest-avatar}

  ai:
    admin:
      base-url: ${NEST_AI_ADMIN_BASE_URL:}
      api-key: ${NEST_AI_ADMIN_API_KEY:}
      model-name: ${NEST_AI_ADMIN_MODEL:}
    user:
      base-url: ${NEST_AI_USER_BASE_URL:}
      api-key: ${NEST_AI_USER_API_KEY:}
      model-name: ${NEST_AI_USER_MODEL:}

  websocket:
    netty:
      port: ${NEST_WS_PORT:8081}

  rag:
    enabled: ${NEST_RAG_ENABLED:true}
    ingest-on-startup: ${NEST_RAG_INGEST_ON_STARTUP:true}
    vector-store:
      host: ${NEST_PGVECTOR_HOST:pgvector}
      port: ${NEST_PGVECTOR_PORT:5432}
      database: ${NEST_PGVECTOR_DB:nest_rag}
      username: ${NEST_PGVECTOR_USER:nest}
      password: ${NEST_PGVECTOR_PASSWORD:nest}

management:
  server:
    port: ${NEST_MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: nest

logging:
  level:
    root: info
    com.nest.mapper: info
    com.nest.service: info
    com.nest.controller: info
