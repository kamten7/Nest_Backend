server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: ${nest.datasource.driver-class-name}
      url: jdbc:mysql://${nest.datasource.host}:${nest.datasource.port}/${nest.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${nest.datasource.username}
      password: ${nest.datasource.password}
  data:
    redis:
      host: ${NEST_REDIS_HOST:}
      port: ${NEST_REDIS_PORT:}
      password: ${NEST_REDIS_PASSWORD:}
      database: ${NEST_REDIS_DATABASE:}
      timeout: ${NEST_REDIS_TIMEOUT:}
      lettuce:
        pool:
          min-idle: ${NEST_REDIS_POOL_MIN_IDLE:}
          max-idle: 8
          max-active: ${NEST_REDIS_POOL_MAX_ACTIVE:}
          max-wait: ${NEST_REDIS_POOL_MAX_WAIT:}

# springdoc-openapi
springdoc:
  api-docs:
    enabled: true

# knife4j
knife4j:
  enable: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.nest.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    org.springframework.jcl: warn
    com.nest.mapper: debug
    com.nest.service: info
    com.nest.controller: info

nest:
  jwt:
    admin-secret-key: ${NEST_JWT_ADMIN_SECRET:}
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: ${NEST_JWT_USER_SECRET:}
    user-ttl: 7200000
    user-token-name: authentication
  minio:
    endpoint: ${NEST_MINIO_ENDPOINT:}
    access-key: ${NEST_MINIO_ACCESS_KEY:}
    secret-key: ${NEST_MINIO_SECRET_KEY:}
    bucket: ${NEST_MINIO_BUCKET:}
  ai:
    admin:
      base-url: ${NEST_AI_ADMIN_BASE_URL:}
      api-key: ${NEST_AI_ADMIN_API_KEY:}
      model-name: ${NEST_AI_ADMIN_MODEL:}
      temperature: 0.1
    user:
      base-url: ${NEST_AI_USER_BASE_URL:}
      api-key: ${NEST_AI_USER_API_KEY:}
      model-name: ${NEST_AI_USER_MODEL:}
      temperature: 0.7
  websocket:
    implementation: netty             # jsr356 | netty（默认 Netty）
    netty:
      port: 8081
  contract:
    template-path: classpath:contract-templates/
  inspection:
    reminder-cron: 0 0 9 * * ?
  rent:
    reminder-cron: 0 0 10 * * ?
    refund-cron: 0 0 11 * * ?
