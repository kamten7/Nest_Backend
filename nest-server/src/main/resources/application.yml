server:
  port: 8080
  shutdown: graceful

spring:
  profiles:
    active: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: ${nest.datasource.driver-class-name}
      url: jdbc:mysql://${nest.datasource.host}:${nest.datasource.port}/${nest.datasource.database}?connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${nest.datasource.username}
      password: ${nest.datasource.password}
      # 时间基准说明：MySQL 容器 system_time_zone=UTC，会让 DB 默认的 CURRENT_TIMESTAMP 以及 mapper
      # 里写的 NOW() 都存成 UTC，而 Java 的 LocalDateTime.now() 存本地时区，两者差 8 小时。
      # 上面的 JDBC URL 用 connectionTimeZone=+08:00 + forceConnectionTimeZoneToSession=true，
      # 让驱动在每条连接上执行 SET time_zone='+08:00'，使"由数据库生成"的时间与 Java 侧一致。
  data:
    redis:
      host: ${NEST_REDIS_HOST:localhost}
      port: ${NEST_REDIS_PORT:6379}
      password: ${NEST_REDIS_PASSWORD:}
      database: ${NEST_REDIS_DATABASE:0}
      timeout: ${NEST_REDIS_TIMEOUT:3000}
      lettuce:
        pool:
          min-idle: ${NEST_REDIS_POOL_MIN_IDLE:1}
          max-idle: 8
          max-active: ${NEST_REDIS_POOL_MAX_ACTIVE:8}
          max-wait: ${NEST_REDIS_POOL_MAX_WAIT:3000}

# springdoc-openapi
springdoc:
  api-docs:
    enabled: true

mybatis:
  # 注意：必须是 classpath*:（跨 jar 匹配）。用 classpath: 只会加载其中一个模块的 mapper 目录。
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.nest.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    org.springframework.jcl: warn
    com.nest.mapper: debug
    com.nest.service: info
    com.nest.controller: info

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: nest

nest:
  jwt:
    admin-secret-key: ${NEST_JWT_ADMIN_SECRET:}
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: ${NEST_JWT_USER_SECRET:}
    user-ttl: 7200000
    user-token-name: authentication
  security:
    login:
      max-failures: ${NEST_LOGIN_MAX_FAILURES:5}
      window-seconds: ${NEST_LOGIN_WINDOW_SECONDS:900}
      lock-seconds: ${NEST_LOGIN_LOCK_SECONDS:900}
  minio:
    endpoint: ${NEST_MINIO_ENDPOINT:}
    # 浏览器可访问的地址（容器部署时填宿主机的 9012；不填则回退到 endpoint）
    public-endpoint: ${NEST_MINIO_PUBLIC_ENDPOINT:}
    access-key: ${NEST_MINIO_ACCESS_KEY:}
    secret-key: ${NEST_MINIO_SECRET_KEY:}
    bucket: ${NEST_MINIO_BUCKET:}
    # 用户头像专用 bucket（与通用 bucket 分开存放）
    avatar-bucket: ${NEST_MINIO_AVATAR_BUCKET:nest-avatar}
  wechat:
    appid: ${NEST_WECHAT_APPID:}
    secret: ${NEST_WECHAT_SECRET:}
    mock-enabled: ${NEST_WECHAT_MOCK:false}        # 生产严禁 true
    mock-openid: ${NEST_WECHAT_MOCK_OPENID:}       # 仅 mock 生效：固定 openid，保证本地反复登录仍是同一租客
  ai:
    quota:
      daily-user-requests: ${NEST_AI_DAILY_QUOTA:100}
    admin:
      base-url: ${NEST_AI_ADMIN_BASE_URL:}
      api-key: ${NEST_AI_ADMIN_API_KEY:}
      model-name: ${NEST_AI_ADMIN_MODEL:}
      temperature: 0.1
    user:
      base-url: ${NEST_AI_USER_BASE_URL:}
      api-key: ${NEST_AI_USER_API_KEY:}
      model-name: ${NEST_AI_USER_MODEL:}
      temperature: 0.7
  websocket:
    implementation: netty             # jsr356 | netty（默认 Netty）
    netty:
      port: 8081
  cors:
    allowed-origins: ${NEST_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  rag:
    enabled: ${NEST_RAG_ENABLED:false}
    ingest-on-startup: ${NEST_RAG_INGEST_ON_STARTUP:false}
    chunk-size: 450
    chunk-overlap: 60
    top-k: 5
    min-score: 0.55
    hybrid: true
    vector-store:
      host: ${NEST_PGVECTOR_HOST:localhost}
      port: ${NEST_PGVECTOR_PORT:5433}
      database: ${NEST_PGVECTOR_DB:nest_rag}
      username: ${NEST_PGVECTOR_USER:nest}
      password: ${NEST_PGVECTOR_PASSWORD:}
      table: nest_knowledge_embedding
  rent:
    reminder-cron: 0 0 10 * * ?
    refund-cron: 0 0 11 * * ?
    deposit-timeout-cron: 0 * * * * ?   # 待缴押金超时扫描（每分钟；阈值见 RentConstant.DEPOSIT_PAY_TIMEOUT_MINUTES）
