# Nest 一键启动编排（Docker Compose v2）
# 这是仓库内正式编排文件（不是示例）：敏感值全部从 .env 注入，.env.example 才是模板。
#
#   docker compose up -d                     # 只起中间件（MySQL/Redis/MinIO）
#   docker compose --profile full up -d --build   # 中间件 + 后端
#   docker compose logs -f backend
#   docker compose down                      # 停止（保留数据卷）
#   docker compose down -v                   # 停止并清空数据（慎用）
#
# 首次启动（数据卷为空）时 MySQL 会自动执行 db/schema.sql 建表、db/data.sql 灌演示数据
name: nest

services:
  mysql:
    image: mysql:8.0
    container_name: nest_mysql
    ports:
      - "${NEST_MYSQL_PORT:-3309}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nest_rent}
    volumes:
      - nest-mysql-data:/var/lib/mysql
      # 首次初始化（数据卷为空）时按文件名顺序执行：建表 → 演示数据
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nest-net

  redis:
    image: redis:7-alpine
    container_name: nest_redis
    ports:
      - "${NEST_REDIS_PORT:-6381}:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}"]
    volumes:
      - nest-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nest-net

  minio:
    image: minio/minio:latest
    container_name: nest_minio
    ports:
      - "${NEST_MINIO_PORT:-9012}:9000"
      - "${NEST_MINIO_CONSOLE_PORT:-9013}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - nest-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nest-net

  minio-init:
    image: minio/mc:latest
    container_name: nest_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET:-nest-rent};
      mc mb --ignore-existing local/${MINIO_AVATAR_BUCKET:-nest-avatar};
      mc anonymous set download local/${MINIO_BUCKET:-nest-rent};
      mc anonymous set download local/${MINIO_AVATAR_BUCKET:-nest-avatar};
      mc cp --recursive /images/ local/${MINIO_BUCKET:-nest-rent}/demo/;
      echo '>>> MinIO bucket 创建完成';
      exit 0;
      "
    volumes:
      - ./db/image:/images:ro
    networks:
      - nest-net

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: nest_pgvector
    ports:
      - "${NEST_PGVECTOR_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${NEST_PGVECTOR_DB:-nest_rag}
      POSTGRES_USER: ${NEST_PGVECTOR_USER:-nest}
      POSTGRES_PASSWORD: ${NEST_PGVECTOR_PASSWORD:?请在 .env 中设置 NEST_PGVECTOR_PASSWORD}
    volumes:
      - nest-pgvector-data:/var/lib/postgresql/data
      - ./db/postgres/01_rag.sql:/docker-entrypoint-initdb.d/01_rag.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEST_PGVECTOR_USER:-nest} -d ${NEST_PGVECTOR_DB:-nest_rag}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nest-net

  backend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest_backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: demo
      NEST_DB_HOST: mysql
      NEST_DB_PORT: "3306"
      NEST_DB_NAME: ${MYSQL_DATABASE:-nest_rent}
      NEST_DB_USER: root
      NEST_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      NEST_REDIS_HOST: redis
      NEST_REDIS_PORT: "6379"
      NEST_REDIS_PASSWORD: ${REDIS_PASSWORD}
      NEST_MINIO_ENDPOINT: http://minio:9000
      NEST_MINIO_PUBLIC_ENDPOINT: ${NEST_MINIO_PUBLIC_ENDPOINT:-http://localhost:9012}
      NEST_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      NEST_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      NEST_MINIO_BUCKET: ${MINIO_BUCKET:-nest-rent}
      NEST_MINIO_AVATAR_BUCKET: ${MINIO_AVATAR_BUCKET:-nest-avatar}
      NEST_JWT_ADMIN_SECRET: ${NEST_JWT_ADMIN_SECRET:?请在 .env 中设置 NEST_JWT_ADMIN_SECRET}
      NEST_JWT_USER_SECRET: ${NEST_JWT_USER_SECRET:?请在 .env 中设置 NEST_JWT_USER_SECRET}
      NEST_AI_USER_BASE_URL: ${NEST_AI_USER_BASE_URL:-}
      NEST_AI_USER_API_KEY: ${NEST_AI_USER_API_KEY:-}
      NEST_AI_USER_MODEL: ${NEST_AI_USER_MODEL:-deepseek-ai/DeepSeek-V3}
      NEST_AI_ADMIN_BASE_URL: ${NEST_AI_ADMIN_BASE_URL:-}
      NEST_AI_ADMIN_API_KEY: ${NEST_AI_ADMIN_API_KEY:-}
      NEST_AI_ADMIN_MODEL: ${NEST_AI_ADMIN_MODEL:-deepseek-ai/DeepSeek-V3}
      NEST_WECHAT_APPID: ${NEST_WECHAT_APPID:-}
      NEST_WECHAT_SECRET: ${NEST_WECHAT_SECRET:-}
      NEST_WECHAT_MOCK: ${NEST_WECHAT_MOCK:-true}
      NEST_WECHAT_MOCK_OPENID: ${NEST_WECHAT_MOCK_OPENID:-nest_demo_tenant}
      NEST_CORS_ALLOWED_ORIGINS: ${NEST_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      NEST_RAG_ENABLED: "true"
      NEST_RAG_INGEST_ON_STARTUP: "true"
      NEST_PGVECTOR_HOST: pgvector
      NEST_PGVECTOR_PORT: "5432"
      NEST_PGVECTOR_DB: ${NEST_PGVECTOR_DB:-nest_rag}
      NEST_PGVECTOR_USER: ${NEST_PGVECTOR_USER:-nest}
      NEST_PGVECTOR_PASSWORD: ${NEST_PGVECTOR_PASSWORD}
    ports:
      - "${NEST_HTTP_PORT:-8080}:8080"
      - "${NEST_WS_PORT:-8081}:8081"
      - "${NEST_MANAGEMENT_PORT:-9090}:9090"
    volumes:
      - nest-logs:/app/logs
    networks:
      - nest-net

  frontend:
    profiles: ["web"]
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_WS_BASE_URL: same-origin
    container_name: nest_frontend
    depends_on:
      - backend
    ports:
      - "${NEST_FRONTEND_PORT:-80}:80"
    networks:
      - nest-net

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:latest
    container_name: nest_prometheus
    ports:
      - "${NEST_PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - nest-prometheus-data:/prometheus
    networks:
      - nest-net

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:latest
    container_name: nest_grafana
    ports:
      - "${NEST_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${NEST_GRAFANA_PASSWORD:-admin}
    volumes:
      - nest-grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - nest-net

networks:
  nest-net:
    name: nest_net

volumes:
  nest-mysql-data:
  nest-redis-data:
  nest-minio-data:
  nest-pgvector-data:
  nest-prometheus-data:
  nest-grafana-data:
  nest-logs:
